<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carton Astro Strike</title>
    <link rel="stylesheet" href="../css/game-full-style.css">
</head>
<body>
    <div id="gameContainer">
        <div id="gameUI" class="game-ui">
            <div class="ui-left">
                <div class="ui-item">
                    <span class="ui-label">Score</span>
                    <span id="uiScore" class="ui-value">0</span>
                </div>
                <div class="ui-item">
                    <span class="ui-label">Wave</span>
                    <span id="uiWave" class="ui-value">1</span>
                </div>
            </div>
            <div class="ui-center">
                <h1>Carton Astro Strike</h1>
                <p id="heroName" class="hero-name">Hero</p>
            </div>
            <div class="ui-right">
                <div class="ui-item">
                    <span class="ui-label">Health</span>
                    <span id="uiHealth" class="ui-value health">❤️ 3</span>
                </div>
                <div class="ui-item">
                    <span class="ui-label">Weapon</span>
                    <span id="uiBullets" class="ui-value">1</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="pauseMenu" class="pause-menu hidden">
            <div class="pause-content">
                <h2>PAUSED</h2>
                <div class="pause-buttons">
                    <button id="resumeBtn" class="menu-btn resume-btn">Resume</button>
                    <button id="exitBtn" class="menu-btn exit-btn">Exit</button>
                </div>
            </div>
        </div>

        <div id="gameOverScreen" class="game-over-screen hidden">
            <div class="game-over-content">
                    <h2>GAME OVER</h2>
                    <div class="final-stats">
                        <p>Score: <span id="finalScore">0</span></p>
                        <p>Wave: <span id="finalWave">1</span></p>
                        <p>Enemies Destroyed: <span id="finalChickens">0</span></p>
                    </div>
                    <div class="game-over-buttons">
                        <button id="restartBtn" class="menu-btn restart-btn">Restart</button>
                        <button id="menuBtn" class="menu-btn menu-btn">Exit</button>
                    </div>
                </div>
        </div>
    </div>

    <script src="../js/game-full.js"></script>
</body>
</html>
